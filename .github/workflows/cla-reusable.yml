name: "CLA Assistant Reusable"

on:
  workflow_call: {}

jobs:
  cla_assistant:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: write
      statuses: write

    steps:
      - name: Mint App token
        id: app-token
        uses: vyos/.github/.github/actions/get-token@production
        with:
          owner: vyos
          repositories: vyos-cla-signatures
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permissions: '{"contents":"write"}'

      - name: Run Contributor Assistant
        if: >
          github.event_name == 'pull_request_target' ||
          (github.event_name == 'issue_comment' &&
           (github.event.comment.body == 'recheck' ||
            github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          path-to-signatures: 'signatures/canary/cla.json'
          path-to-document: 'https://github.com/vyos/vyos-cla-signatures/blob/production/README.md'
          branch: 'canary-app-token'
          allowlist: >-
            github-actions[bot],
            dependabot-preview[bot],
            insights-engineering-bot,
            dependabot[bot],
            copilot,
            github-copilot[bot],
            copilot[bot],
            Copilot,
            vyosbot,
            pre-commit-ci,
            pre-commit-ci[bot],
            codecov,
            codecov[bot],
            mergify,
            mergify[bot],
            netlify,
            netlify[bot],
            claude,
            claude[bot],
            coderabbitai,
            coderabbitai[bot]
          remote-organization-name: 'vyos'
          remote-repository-name: 'vyos-cla-signatures'
          lock-pullrequest-aftermerge: false
